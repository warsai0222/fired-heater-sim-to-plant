<text x="1190" y="806.0" class="t9 b" text-anchor="start">NATURAL-DRAFT RUNBACK (I-101, see U100-PID-102)</text>
<text x="1190" y="819.4" class="t9" text-anchor="start">Initiators: XS-1341 FD stop, XS-1351 ID stop, XS-1349 APH rotor stop</text>
<text x="1190" y="832.8" class="t9" text-anchor="start">Actions: open XV-1361 bypass damper (D-101) and XV-1362</text>
<text x="1190" y="846.2" class="t9" text-anchor="start">emergency air doors (D-102); stop the other fan; clamp</text>
<text x="1190" y="859.6" class="t9" text-anchor="start">PIC-1202 setpoint so firing ≤ 60 % of normal. Not a fuel trip.</text>
<text x="1190" y="873.0" class="t9" text-anchor="start"></text>
<text x="1190" y="886.4" class="t9 b" text-anchor="start">OPTIMIZER LIMITS ON THIS SHEET</text>
<text x="1190" y="899.8" class="t9" text-anchor="start">TIC-1345 APH gas outlet ≥ 140 °C (acid dew point margin)</text>
<text x="1190" y="913.2" class="t9" text-anchor="start">SI-1341 / SI-1351 fan speed ≤ 95 % (capacity)</text>
<text x="1190" y="926.6" class="t9" text-anchor="start">Fan power JI-1341 + JI-1351 is a cost term</text>
<text x="1190" y="940.0" class="t9" text-anchor="start"></text>
<text x="1190" y="953.4" class="t9 b" text-anchor="start">DEGRADATION FINGERPRINTS (Type B)</text>
<text x="1190" y="966.8" class="t9" text-anchor="start">Seal leakage ↑: AT-1326 − AT-1327 ↑ (≈ 1.2 new), SI-1351 ↑,</text>
<text x="1190" y="980.2" class="t9" text-anchor="start">  TIC-1345 ↓ (dilution), FIC-1341 ↑ for same burner air</text>
<text x="1190" y="993.6" class="t9" text-anchor="start">Fouling ↑: PDT-1347 ↑, TT-1343 ↓, TIC-1345 ↑, ID load ↑</text>
<rect x="30" y="1012" width="1068" height="160" rx="0" class="box"/>
<text x="40" y="1030" class="t10 b" text-anchor="start">NOTES</text>
<text x="40" y="1048" class="t9" text-anchor="start">1. Regenerative APH: gas and air halves counter-current; rotor drive with rotation monitor XS-1349 (rotor stop = runback + APH fire watch).</text>
<text x="40" y="1063" class="t9" text-anchor="start">2. FD fan K-101 sets combustion air (FIC-1341, cascaded from AIC-1321 arch O2); ID fan K-102 holds arch draft (PIC-1311 on PID-102).</text>
<text x="40" y="1078" class="t9" text-anchor="start">3. TV-1345 cold-air bypass (TIC-1345 SP 148 °C, Lo alarm 145, limit 140) opens in cold weather / low load; closed at design.</text>
<text x="40" y="1093" class="t9" text-anchor="start">4. FIC-1341 measures FD discharge air, which includes APH seal leakage — burner air = FIC-1341 minus leakage.</text>
<text x="40" y="1108" class="t9" text-anchor="start">5. SB-102A/B steam soot blowers (hot and cold end) sequenced with SB-101A–F; offline water-wash connections not shown.</text>
<text x="40" y="1123" class="t9" text-anchor="start">6. Duct expansion joints, inlet filter/silencer, fan inlet dampers and seal-air systems not shown.</text>
<text x="40" y="1138" class="t9" text-anchor="start">7. Symbols: see legend on U100-PID-101. Values per design/tag_register.csv (Rev B); preliminary, pending ChemE review.</text></svg>